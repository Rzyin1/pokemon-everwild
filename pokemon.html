<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Details | Everwild</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101b19;color:#f3f7f1;font:16px system-ui,Arial,sans-serif}header{background:linear-gradient(135deg,#214c37,#172b28);padding:28px 20px}header div,main{max-width:1000px;margin:auto}a{color:#b7f0c4}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}.muted{color:#b7c9c0}.card{background:#1c302b;border:1px solid #38554a;border-radius:18px;padding:24px;margin:20px 0}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:25px;align-items:center}.hero img{width:100%;border-radius:14px;background:white}.tag{background:#aaa68a;color:#151b17;padding:5px 14px;border-radius:20px;font-weight:bold;display:inline-block}.stats{display:grid;gap:12px}.stat{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center}.bar{background:#344a40;height:13px;border-radius:20px;overflow:hidden}.fill{background:#7fcb94;height:100%}table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #38554a}th{color:#b7c9c0}main{padding:16px 20px 50px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.pill{display:inline-block;background:#29483a;padding:6px 12px;border-radius:20px;margin:4px 5px 4px 0}footer{text-align:center;color:#9db5aa;padding:20px}@media(max-width:700px){.hero,.grid{grid-template-columns:1fr}.stat{grid-template-columns:100px 1fr 36px}} 
</style></head><body><header><div><a href="index.html">← Back to Pokédex</a><h1 id="title">Pokémon Details</h1><span id="type"></span></div></header><main id="content"><p>Loading Pokémon details…</p></main><footer>Pokémon Everwild · Unofficial fan project</footer><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=Number(new URLSearchParams(location.search).get('id')||1);
fetch('data/pokedex.json?v=20261030-solursus', {cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Unable to load Pokédex');return r.json()}).then(data=>{
const p=data.pokemon.find(x=>x.number===id);if(!p){document.getElementById('content').textContent='Pokémon not found.';return}
document.title=p.name+' | Pokémon Everwild';document.getElementById('title').textContent='#'+String(p.number).padStart(3,'0')+' — '+p.name;
document.getElementById('type').innerHTML='<span class="tag">'+esc([p.type1,p.type2].filter(Boolean).join(' / '))+'</span>';
const stats=p.base_stats||{}, labels=[['hp','HP'],['attack','Attack'],['defense','Defense'],['special_attack','Sp. Attack'],['special_defense','Sp. Defense'],['speed','Speed']];
const moves=(p.moves||[]).slice().sort((a,b)=>a.level-b.level);
const image=(p.number===5?"%23005%20Solbruin-card.png":p.number===6?"%23006%20Solursus%20card.png":p.number===4?"004-Solcub-card.png":p.number===2?"002-Wolvigor-card.png":p.images?.concept) || (p.number===1?'001-wolvyn.png':'assets/pokemon/'+String(p.number).padStart(3,'0')+'-'+p.name.toLowerCase()+'.png');
const ability=(p.abilities||[]).length?(p.abilities||[]).map(a=>'<span class="pill">'+esc(a.name)+' ('+esc(a.slot)+')</span>').join(''):'To be determined';
const evo=p.number===5?'Evolves from Solcub at Level 18 · Evolves into Solursus at Level 36':p.number===6?'Evolves from Solbruin at Level 36 · Final evolution':p.number===4?'Evolves at Level 18 · Final evolution at Level 36':p.number===3?'Evolves from Wolvigor at Level 35 · Final evolution':p.number===2?'Evolves from Wolvyn at Level 17 · Evolves again at Level 35':p.evolution_levels?'First evolution: Level '+esc(p.evolution_levels.to_stage_2)+' · Final evolution: Level '+esc(p.evolution_levels.to_stage_3):'Evolution details coming soon';
document.getElementById('content').innerHTML='<section class="card hero"><div><img src="'+esc(image)+'" alt="'+esc(p.name)+' official concept art" onerror="this.replaceWith(document.createTextNode(\'Artwork coming soon\'))"></div><div><p class="muted">'+esc(p.category||'')+'</p><h2>'+esc(p.name)+'</h2><p>'+esc(p.pokedex_entry||'Pokédex entry coming soon.')+'</p><p>Height: '+esc(p.height_m)+' m · Weight: '+esc(p.weight_kg)+' kg</p><p class="muted">'+esc(p.personality||'')+'</p></div></section><div class="grid"><section class="card"><h2>Base Stats</h2><div class="stats">'+labels.map(([k,label])=>'<div class="stat"><span>'+label+'</span><div class="bar"><div class="fill" style="width:'+Math.min(100,Math.max(0,(Number(stats[k])||0)/255*100))+'%"></div></div><strong>'+esc(stats[k]??'—')+'</strong></div>').join('')+'</div><p><strong>Total: '+esc(stats.total??'—')+'</strong></p></section><section class="card"><h2>Abilities</h2><p>'+ability+'</p><h2>Evolution</h2><p>'+evo+'</p><p class="muted">Further evolution details are in development.</p></section></div><section class="card"><h2>Level-Up Moves</h2><table><thead><tr><th>Level</th><th>Move</th></tr></thead><tbody>'+moves.map(m=>'<tr><td>'+esc(m.level)+'</td><td>'+esc(m.name)+'</td></tr>').join('')+'</tbody></table>'+(moves.length?'':'<p class="muted">Moveset to be determined.</p>')+'</section>';
}).catch(()=>{document.getElementById('content').textContent='Could not load Pokémon details. Please try refreshing.'});
</script></body></html>
